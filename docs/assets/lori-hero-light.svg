<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
<title id="t">Lori Cloud Work</title>
<desc id="d">A member asks Lori for a launch deck, approves the command, and receives the finished file.</desc>
<style>
.bg{fill:#f9fafc}.card{fill:#ffffff;stroke:#dbdee3}.line{stroke:#dbdee3}.fg{fill:#0e1218}.muted{fill:#545860}.accent{fill:#cb2e00}.soft{fill:#f2f3f7}.ok{fill:#00703a}
*{transform-box:fill-box}
.sq{fill:#cb2e00;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1.15) both}
.loop{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
.cover{fill:#ffffff;animation-name:type;animation-timing-function:steps(35,end)}
.caret{fill:#cb2e00;animation-name:typeCaret;animation-timing-function:steps(35,end)}
.send{transform-origin:center;animation-name:press}
.placeholder{animation-name:hint}
.r1{animation-name:r1}.r1spin{transform-origin:center;animation:spin 1s linear infinite}
.r1busy{animation-name:busy1}.r1done{animation-name:done1}
.r2{animation-name:r2}.r2busy{animation-name:busy2}.r2done{animation-name:done2}
.approve{animation-name:approve;transform-origin:center}.approved{animation-name:approved}
.file{animation-name:file}.s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}
.stage{animation-name:stage}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stage{0%,96%{opacity:1}100%{opacity:0}}
@keyframes hint{0%,5%{opacity:1}6%,100%{opacity:0}}
@keyframes type{0%,6%{transform:translateX(0)}24%,100%{transform:translateX(330px)}}
@keyframes typeCaret{0%,6%{transform:translateX(0);opacity:1}24%,27%{transform:translateX(330px);opacity:1}28%,100%{transform:translateX(330px);opacity:0}}
@keyframes press{0%,26%{transform:none}27.5%{transform:scale(.86)}29%,100%{transform:none}}
@keyframes r1{0%,29%{opacity:0;transform:translateY(8px)}32%,100%{opacity:1;transform:none}}
@keyframes busy1{0%,37%{opacity:1}38%,100%{opacity:0}}
@keyframes done1{0%,37%{opacity:0}38%,100%{opacity:1}}
@keyframes r2{0%,38%{opacity:0;transform:translateY(8px)}41%,100%{opacity:1;transform:none}}
@keyframes busy2{0%,62%{opacity:1}63%,100%{opacity:0}}
@keyframes done2{0%,62%{opacity:0}63%,100%{opacity:1}}
@keyframes approve{0%,50%{opacity:1;transform:none}51.5%{opacity:1;transform:scale(.92)}53%{opacity:1;transform:none}54%,100%{opacity:0}}
@keyframes approved{0%,53%{opacity:0}55%,100%{opacity:1}}
@keyframes file{0%,63%{opacity:0;transform:translateY(12px)}67%,100%{opacity:1;transform:none}}
@keyframes s1{0%,66%{opacity:0;transform:translateY(6px)}69%,100%{opacity:1;transform:none}}
@keyframes s2{0%,67.5%{opacity:0;transform:translateY(6px)}70.5%,100%{opacity:1;transform:none}}
@keyframes s3{0%,69%{opacity:0;transform:translateY(6px)}72%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.placeholder,.cover,.caret,.r1busy,.r2busy,.approve{opacity:0}}
</style>
<rect class="bg" width="960" height="420" rx="20"/>
<g transform="translate(48 38) scale(.26)"><rect class="sq" style="animation-delay:0.00s" x="36" y="0" width="30" height="30" rx="5.5"/><rect class="sq" style="animation-delay:0.07s" x="0" y="18" width="30" height="30" rx="5.5"/><rect class="sq" style="animation-delay:0.14s" x="72" y="18" width="30" height="30" rx="5.5"/><rect class="sq" style="animation-delay:0.21s" x="36" y="36" width="30" height="30" rx="5.5"/><rect class="sq" style="animation-delay:0.28s" x="0" y="54" width="30" height="30" rx="5.5"/><rect class="sq" style="animation-delay:0.35s" x="72" y="54" width="30" height="30" rx="5.5"/><rect class="sq" style="animation-delay:0.42s" x="36" y="72" width="30" height="30" rx="5.5"/></g>
<text class="fg" x="86" y="59" font-size="21" font-weight="600" letter-spacing="-.3">Lori</text>
<g class="stage loop">
<rect class="card" x="48" y="92" width="864" height="64" rx="14"/>
<text class="muted placeholder loop" x="72" y="130" font-size="17">Ask Lori to work on something…</text>
<text class="fg" x="72" y="130" font-size="17">Turn these notes into a launch deck</text>
<rect class="cover loop" x="68" y="108" width="345" height="32"/>
<rect class="caret loop" x="71" y="113" width="2" height="23" rx="1"/>
<g class="send loop"><circle class="accent" cx="876" cy="124" r="17"/><path d="M876 132v-15M869.5 123.500l6.500-6.500 6.500 6.500" fill="none" stroke="#ffffff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="r1 loop">
<g class="r1busy loop"><circle class="r1spin" cx="64" cy="192" r="7" fill="none" stroke="#cb2e00" stroke-width="2" stroke-dasharray="30 14" stroke-linecap="round"/></g>
<path class="r1done loop" d="M58 192l4.500 4.500 8-9" fill="none" stroke="#00703a" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
<text class="muted" x="84" y="197" font-size="15">Read launch-notes.md</text>
</g>
<g class="r2 loop">
<g class="r2busy loop"><circle cx="64" cy="232" r="7" fill="none" stroke="#cb2e00" stroke-width="2"/></g>
<path class="r2done loop" d="M58 232l4.500 4.500 8-9" fill="none" stroke="#00703a" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
<text class="muted" x="84" y="237" font-size="15">Build the deck in a private sandbox</text>
<g class="approve loop"><rect class="accent" x="822" y="215" width="90" height="34" rx="9"/><text x="867" y="237" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Approve</text></g>
<text class="ok approved loop" x="912" y="237" font-size="14" font-weight="600" text-anchor="end">Approved</text>
</g>
<g class="file loop">
<rect class="card" x="48" y="272" width="864" height="104" rx="14"/>
<rect class="soft" x="68" y="296" width="56" height="56" rx="11"/>
<rect x="82" y="312" width="28" height="19" rx="3" fill="none" stroke="#cb2e00" stroke-width="2"/><path d="M96 331v6M88 339h16" stroke="#cb2e00" stroke-width="2" stroke-linecap="round"/>
<text class="fg" x="142" y="319" font-size="17" font-weight="600">launch-deck.pptx</text>
<text class="muted" x="142" y="343" font-size="14">8 slides, ready to review</text>
<g class="s1 loop"><rect class="soft" x="624" y="294" width="84" height="60" rx="7"/><rect class="accent" x="634" y="304" width="38" height="6" rx="3"/><rect class="muted" opacity=".4" x="634" y="317" width="58" height="4" rx="2"/><rect class="muted" opacity=".4" x="634" y="327" width="46" height="4" rx="2"/></g>
<g class="s2 loop"><rect class="soft" x="716" y="294" width="84" height="60" rx="7"/><rect class="accent" x="728" y="330" width="11" height="14" rx="2"/><rect class="accent" opacity=".7" x="744" y="320" width="11" height="24" rx="2"/><rect class="accent" opacity=".45" x="760" y="308" width="11" height="36" rx="2"/></g>
<g class="s3 loop"><rect class="soft" x="808" y="294" width="84" height="60" rx="7"/><circle cx="850" cy="324" r="15" fill="none" stroke="#cb2e00" stroke-width="7" opacity=".35"/><path d="M850 309a15 15 0 0 1 13 22.500" fill="none" stroke="#cb2e00" stroke-width="7"/></g>
</g>
</g>
</svg>
