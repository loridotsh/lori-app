[package]
name = "lori-work-provider"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rig-core = { version = "=0.42.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
bytes = "1"
url = "2"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
